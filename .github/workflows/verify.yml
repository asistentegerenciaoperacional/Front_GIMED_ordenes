name: Verificar front
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/auth.integration.mjs
      - run: npm run build
      - run: npm run api:generate
      - run: git diff --exit-code -- src/shared/api/generated.ts
      - run: npm run perf:verify
      - run: npm audit --omit=dev --audit-level=high
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && vars.GIMED_PILOT_ENABLED == 'true'
    needs: verify
    environment: piloto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publicar Worker
        run: npx --no-install wrangler deploy --var "GIMED_EDGE_URL:$GIMED_EDGE_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GIMED_EDGE_URL: ${{ vars.GIMED_EDGE_URL }}
          WRANGLER_SEND_METRICS: "false"
